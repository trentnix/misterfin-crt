name: Go validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer revision makes an older validation run unnecessary.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, playback, and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install playback test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libmpv-dev libavcodec-dev libavutil-dev
      - name: Build host client
        run: make host
      - name: Check Go code
        run: go vet ./...
      - name: Test Go, playback, and native adapters
        run: make test
      - name: Check Go concurrency
        run: go test -race ./...
      - name: Test browser through the headless harness
        run: make test-browse
