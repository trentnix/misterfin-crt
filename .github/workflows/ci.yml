name: Go validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer revision makes an older validation run unnecessary.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, playback, and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install playback test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libmpv-dev libavcodec-dev libavutil-dev
      - name: Build host client
        run: make host
      - name: Check Go code
        run: make lint
      - name: Check reachable Go vulnerabilities
        run: make vulnerability-check
      - name: Test Go, playback, and native adapters
        run: make test
      - name: Check Go concurrency
        run: go test -race ./...
      - name: Test browser through the headless harness
        run: make test-browse

      - name: Exercise repeated playback and recovery
        run: make test-endurance
      - name: Collect performance report
        run: make performance
      - name: Publish performance summary
        if: always()
        run: |
          if test -f build/reports/performance/report.md; then
            cat build/reports/performance/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain validation reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validation-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/
          if-no-files-found: warn
          retention-days: 14

  arm:
    name: Compile MiSTer application
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install verified Zig toolchain
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --show-error --location --retry 3 https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz -o zig.tar.xz
          echo '24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c  zig.tar.xz' | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.14.1" >> "$GITHUB_PATH"
      - name: Cross-compile with MiSTer's glibc target
        run: make arm
