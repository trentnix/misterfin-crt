name: Extended reliability

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: Minimum endurance duration
        type: choice
        default: '15'
        options: ['5', '15', '30', '60']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  endurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install decoder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libmpv-dev libavcodec-dev libavutil-dev
      - name: Build client
        run: make host
      - name: Exercise sustained playback and recovery
        env:
          RUN_MINUTES: ${{ inputs.minutes || '15' }}
        run: |
          case "$RUN_MINUTES" in 5|15|30|60) ;; *) exit 1 ;; esac
          run_seconds=$((RUN_MINUTES * 60))
          python3 -m tools.ghostty.endurance --cycles 2 --seconds "$run_seconds"
      - name: Collect performance report
        run: make performance
      - name: Publish performance summary
        if: always()
        run: |
          if test -f build/reports/performance/report.md; then
            cat build/reports/performance/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain reliability reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reliability-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/
          if-no-files-found: warn
          retention-days: 30
